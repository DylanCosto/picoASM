[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.5.0"
license = "MIT"
edition = "2024"
rust-version = "1.91.0"

[workspace.dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.0", features = ["derive"] }
env_logger = "0.11.0"
flate2 = { version = "1.1.0", default-features = false, features = ["zlib-rs"] }
log = "0.4.20"
memchr = "2.3.3"
# A fixed commit of the `pasta` repository (its `main` on 2026-11-11, three past v0.9.1), so that
# `cargo install --git` without `--locked` builds the same pasta as Cargo.lock does.
pasta = { git = "https://github.com/DylanCosto/pasta.git", rev = "4ccbbb42d664acf7b5cc19495f95d0a3261dc13e" }
rayon = "1.10.0"
tempfile = "3.10.0"
thiserror = "2.0.0"

picoasm = { path = "crates/picoasm" }
picoasm-consensus = { path = "crates/picoasm-consensus" }
picoasm-io = { path = "crates/picoasm-io" }
picoasm-overlap = { path = "crates/picoasm-overlap" }
picoasm-seq = { path = "crates/picoasm-seq" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
todo = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
inefficient_to_string = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"

# One codegen unit with fat LTO, as in pasta: hot loops inline across crates.
[profile.release]
codegen-units = 1
lto = "fat"
