[package]
name = "picoasm"
version = "0.6.2"
description = "Bacterial genome assembler for Oxford Nanopore R10.4.1 and PacBio HiFi reads"
license = "MIT"
edition = "2024"
rust-version = "1.91.0"
repository = "https://github.com/DylanCosto/picoASM"
readme = "README.md"
keywords = ["bioinformatics", "genome-assembly", "nanopore", "pacbio", "bacteria"]
categories = ["science::bioinformatics", "command-line-utilities"]
exclude = ["/.github", "/benchmarks", "/scripts"]

[[bin]]
name = "picoasm"
path = "src/bin/picoasm/main.rs"

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.0", features = ["derive"] }
env_logger = "0.11.0"
flate2 = { version = "1.1.0", default-features = false, features = ["zlib-rs"] }
log = "0.4.20"
memchr = "2.3.3"
# pasta, published on crates.io as pasta-hts (the `pasta` name belongs to another crate) and
# imported as `pasta`.
pasta = { package = "pasta-hts", version = "0.9.1" }
rayon = "1.10.0"
thiserror = "2.0.0"

[dev-dependencies]
tempfile = "3.10.0"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
todo = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
inefficient_to_string = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"

# One codegen unit with fat LTO, as in pasta: hot loops inline across crates.
[profile.release]
codegen-units = 1
lto = "fat"
