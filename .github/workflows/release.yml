name: Release

# Builds the `picoasm` binary for each platform when a release is published, and attaches it
# to the release as picoasm-<tag>-<target>.tar.gz with a SHA-256 checksum.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=picoasm-${{ github.event.release.tag_name }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/picoasm README.md LICENSE "$name"/
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload ${{ github.event.release.tag_name }} --clobber
          picoasm-${{ github.event.release.tag_name }}-${{ matrix.target }}.tar.gz
          picoasm-${{ github.event.release.tag_name }}-${{ matrix.target }}.tar.gz.sha256
